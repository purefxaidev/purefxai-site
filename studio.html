<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PureFxAi Video Engine - สร้างวิดีโอ AI ฟรี</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="lms.css">
<style>
.st{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin:20px 0 60px}@media(max-width:900px){.st{grid-template-columns:1fr}}
.drop{border:1.5px dashed #3a4152;border-radius:14px;padding:22px;text-align:center;cursor:pointer;color:var(--mut);min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.drop.has{border-color:var(--gold)}.drop img{max-width:100%;max-height:280px;border-radius:10px}
.durs{display:flex;gap:8px}.durs label{flex:1;margin:0}.durs input{display:none}.durs span{display:block;text-align:center;padding:10px;border:1px solid #2c3343;border-radius:10px;cursor:pointer}.durs input:checked+span{border-color:var(--gold);color:var(--gold);background:rgba(232,184,74,.08)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--mut);margin:14px 0}.chk input{width:auto;margin-top:4px}
video{width:100%;border-radius:14px;background:#000;display:block;max-height:70vh}.big{font-size:2.2rem;font-weight:600;color:var(--gold2)}
.prog{height:6px;border-radius:4px;background:#1c212c;overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:pp 1.6s ease-in-out infinite}@keyframes pp{0%{margin-left:-30%}100%{margin-left:100%}}
@media(prefers-reduced-motion:reduce){.prog i{animation:none;width:100%}}
</style></head><body>
<nav><div class="wrap"><a class="logo" href="index.html">PureFx<span>Ai</span> <small class="mut" style="font-size:.8rem">Video Engine</small></a><div class="nr"><a class="btn o s" href="index.html" data-t="home"></a><a class="btn o s" href="learn.html" data-t="cls"></a><div class="lang"><button data-l="th">TH</button><button data-l="en">EN</button></div></div></div></nav>
<main class="wrap">
<h1 class="pg" data-t="h"></h1><p class="mut" data-t="sub"></p>
<div class="st"><form class="card" id="f" autocomplete="off">
 <label data-t="img"></label><label class="drop" id="dz"><input type="file" id="fi" name="image" accept="image/jpeg,image/png,image/webp" hidden required><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span id="dzt" data-t="pick"></span></label>
 <label data-t="pr"></label><textarea name="prompt" id="pr" rows="4" maxlength="600" required></textarea>
 <label data-t="dur"></label><div class="durs"></div>
 <label class="chk"><input type="checkbox" name="agree" value="1" required><span data-t="terms"></span></label>
 <div id="msg"></div><button class="btn" id="go" data-t="gen"></button><p class="mut" style="font-size:.82rem;margin-top:10px" id="lim"></p>
</form>
<section class="card" id="out"><h3 data-t="res"></h3><p class="mut" data-t="resHint"></p></section></div>
</main>
<script>
const T={th:{home:"หน้าแรก",cls:"ห้องเรียน",h:"สร้างวิดีโอ AI ฟรี",sub:"PureFxAi Video Engine - อัปโหลดภาพ 1 ภาพ บอกว่าอยากให้เคลื่อนไหวอย่างไร แล้วรับวิดีโอสั้นได้เลย ไม่ต้องล็อกอิน",img:"ภาพต้นฉบับ (JPG / PNG / WEBP ไม่เกิน 8 MB)",pick:"แตะเพื่อเลือกภาพ",pr:"คำสั่ง (ไทยหรืออังกฤษ) เช่น กล้องค่อยๆ ซูมเข้า ผู้หญิงยิ้มและหันมามองกล้อง ผมพลิ้วตามลม",dur:"ความยาว",terms:"ฉันยืนยันว่ามีสิทธิ์ใช้ภาพนี้ ไม่ใช้ภาพบุคคลจริงโดยไม่ได้รับอนุญาต ไม่สร้างเนื้อหาทางเพศ ความรุนแรง หรือเกี่ยวกับผู้เยาว์ และยอมรับว่าผลลัพธ์จะถูกลบภายใน 24 ชั่วโมง",gen:"สร้างวิดีโอ",res:"ผลลัพธ์",resHint:"วิดีโอของคุณจะแสดงที่นี่ (เก็บไว้ 24 ชั่วโมง)",left:"สิทธิ์วันนี้เหลือ",queued:"อยู่ในคิว ลำดับที่",waiting:"รอเครื่องว่าง (งานผลิตของทีมได้สิทธิ์ก่อน)",running:"กำลังสร้างวิดีโอ...",eta:"เวลาโดยประมาณ",min:"นาที",done:"เสร็จแล้ว",dl:"ดาวน์โหลดวิดีโอ",exp:"ลิงก์หมดอายุ",again:"สร้างใหม่",
 e:{disabled:"ระบบปิดให้บริการชั่วคราว",ip_limit:"วันนี้คุณใช้สิทธิ์ครบแล้ว กลับมาใหม่พรุ่งนี้",daily_cap:"วันนี้มีผู้ใช้ครบโควตาแล้ว กลับมาใหม่พรุ่งนี้",queue_full:"คิวเต็ม ลองใหม่ภายหลัง",too_large:"ไฟล์ใหญ่เกิน 8 MB",no_image:"กรุณาเลือกภาพ",bad_image:"ไฟล์ภาพไม่ถูกต้อง (ต้องเป็น JPG/PNG/WEBP ขนาด 256-6000 px)",terms:"กรุณายอมรับเงื่อนไข",no_prompt:"กรุณาพิมพ์คำสั่ง",blocked_prompt:"คำสั่งนี้ขัดกับนโยบาย (เนื้อหาทางเพศ ผู้เยาว์ ความรุนแรง หรือบุคคลจริง)",render_failed:"สร้างวิดีโอไม่สำเร็จ ลองภาพหรือคำสั่งอื่น",not_found:"ไม่พบงานนี้ หรือหมดอายุแล้ว",x:"เกิดข้อผิดพลาด ลองใหม่อีกครั้ง"}},
en:{home:"Home",cls:"Classroom",h:"Free AI Video Generator",sub:"PureFxAi Video Engine - upload one image, describe the motion, get a short video. No login needed.",img:"Source image (JPG / PNG / WEBP, max 8 MB)",pick:"Tap to choose an image",pr:"Prompt (Thai or English), e.g. slow camera push-in, the woman smiles and turns to the camera, hair moving in the wind",dur:"Duration",terms:"I confirm I have the right to use this image, will not use real people without consent, and will not create sexual, violent or minor-related content. Results are deleted after 24 hours.",gen:"Generate video",res:"Result",resHint:"Your video will appear here (kept for 24 hours)",left:"Free generations left today",queued:"In queue, position",waiting:"Waiting for a free slot (team production jobs have priority)",running:"Generating your video...",eta:"Estimated time",min:"min",done:"Done",dl:"Download video",exp:"Link expires",again:"Create another",
 e:{disabled:"The generator is temporarily offline",ip_limit:"You have used today's free generations. Come back tomorrow.",daily_cap:"Today's free quota is used up. Come back tomorrow.",queue_full:"The queue is full, please try later",too_large:"File is larger than 8 MB",no_image:"Please choose an image",bad_image:"Invalid image (JPG/PNG/WEBP, 256-6000 px)",terms:"Please accept the terms",no_prompt:"Please enter a prompt",blocked_prompt:"This prompt violates our policy (sexual, minors, violence or real people)",render_failed:"Generation failed, try another image or prompt",not_found:"Job not found or expired",x:"Something went wrong, please try again"}}};
let L=new URLSearchParams(location.search).get('lang')||localStorage.getItem('pfx_lang')||'th';const t=k=>T[L][k]||k,E=k=>T[L].e[k]||T[L].e.x;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
document.querySelector('.durs').innerHTML=[5,10,15].map((d,i)=>`<label><input type="radio" name="duration" value="${d}" ${i==0?'checked':''}><span>${d}s</span></label>`).join('');
let CFG={},cur=localStorage.getItem('pfx_studio_job'),timer;
function apply(){document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));pr.placeholder=t('pr');document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));lim.textContent=CFG.enabled?`${t('left')}: ${CFG.remaining}/${CFG.perIp}`:E('disabled');if(fi.files[0])dzt.textContent=fi.files[0].name;if(cur)poll()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('pfx_lang',L);apply()});
fi.onchange=()=>{const x=fi.files[0];if(!x)return;if(x.size>8*1024*1024){msg.innerHTML=`<div class="msg err">${E('too_large')}</div>`;fi.value='';return}
 dz.classList.add('has');dz.querySelector('img')?.remove();const im=new Image();im.src=URL.createObjectURL(x);dz.prepend(im);dzt.textContent=x.name;msg.innerHTML=''};
async function cfg(){try{CFG=await (await fetch('/api/studio/config')).json()}catch(e){CFG={}}go.disabled=!CFG.enabled||!CFG.remaining;apply()}
f.onsubmit=async e=>{e.preventDefault();msg.innerHTML='';go.disabled=true;
 try{const r=await fetch('/api/studio/jobs',{method:'POST',headers:{'x-pfx':'1'},body:new FormData(f)});const j=await r.json().catch(()=>({}));
  if(!r.ok){msg.innerHTML=`<div class="msg err">${esc(E(j.error))}</div>`;go.disabled=false;return}cur=j.token;localStorage.setItem('pfx_studio_job',cur);show(j);poll();cfg()}catch(e){msg.innerHTML=`<div class="msg err">${E('x')}</div>`;go.disabled=false}};
function show(j){const eta=Math.max(1,Math.round((j.eta||0)/60));
 if(j.status=='done'){out.innerHTML=`<h3>${t('done')}</h3><video controls playsinline autoplay loop src="/api/studio/result/${cur}"></video><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><a class="btn" href="/api/studio/result/${cur}?dl=1">${t('dl')}</a><button class="btn o" id="ag">${t('again')}</button></div><p class="mut" style="font-size:.8rem;margin-top:8px">${t('exp')}: ${new Date(j.expires).toLocaleString(L=='th'?'th-TH':'en-GB')}</p>`;ag.onclick=()=>{localStorage.removeItem('pfx_studio_job');cur=null;out.innerHTML=`<h3>${t('res')}</h3><p class="mut">${t('resHint')}</p>`;cfg()};return}
 if(j.status=='failed'){out.innerHTML=`<h3>${t('res')}</h3><div class="msg err">${E(j.error)}</div>`;localStorage.removeItem('pfx_studio_job');cur=null;return}
 out.innerHTML=`<h3>${j.status=='running'?t('running'):j.status=='waiting'?t('waiting'):t('queued')+' '+j.position}</h3>${j.status!='running'&&j.position?`<div class="big">#${j.position}</div>`:''}<div class="prog"><i></i></div><p class="mut">${t('eta')}: ~${eta} ${t('min')}</p>`}
async function poll(){clearTimeout(timer);if(!cur)return;try{const r=await fetch('/api/studio/jobs/'+cur);const j=await r.json();if(!r.ok){out.innerHTML=`<h3>${t('res')}</h3><div class="msg err">${E(j.error)}</div>`;localStorage.removeItem('pfx_studio_job');cur=null;return}show(j);if(j.status!='done'&&j.status!='failed')timer=setTimeout(poll,5000)}catch(e){timer=setTimeout(poll,8000)}}
cfg();
</script></body></html>
