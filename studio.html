<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PureFxAi Studio - สร้างวิดีโอ เพลง และภาพ AI ฟรี</title>
<meta name="referrer" content="strict-origin-when-cross-origin">

<style>
.st{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin:20px 0 60px}@media(max-width:900px){.st{grid-template-columns:1fr}}
.drop{border:1.5px dashed #3a4152;border-radius:14px;padding:22px;text-align:center;cursor:pointer;color:var(--mut);min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.drop.has{border-color:var(--gold)}.drop img{max-width:100%;max-height:280px;border-radius:10px}
.durs{display:flex;gap:8px}.durs label{flex:1;margin:0}.durs input{display:none}.durs span{display:block;text-align:center;padding:10px;border:1px solid #2c3343;border-radius:10px;cursor:pointer}.durs input:checked+span{border-color:var(--gold);color:var(--gold);background:rgba(232,184,74,.08)}
.ktabs{display:flex;gap:8px;margin:18px 0 0;flex-wrap:wrap}.ktabs button{padding:9px 18px;border-radius:22px;border:1px solid #2c3343;background:none;color:var(--mut);font:inherit;cursor:pointer;display:flex;gap:8px;align-items:center}.ktabs button.on{border-color:var(--gold);color:#111;background:linear-gradient(135deg,var(--gold),var(--gold2))}.ktabs small{font-size:.7rem;opacity:.8}
.hlp{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.hlp button{padding:4px 10px;border-radius:8px;border:1px solid #2c3343;background:#10131b;color:var(--txt);font:inherit;font-size:.8rem;cursor:pointer}.soonbox{text-align:center;padding:40px 10px}.soonbox b{font-size:1.6rem;color:var(--gold)}audio{width:100%;margin-top:10px}.resimg{width:100%;border-radius:12px;display:block}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--mut);margin:14px 0}.chk input{width:auto;margin-top:4px}
video{width:100%;border-radius:14px;background:#000;display:block;max-height:70vh}.big{font-size:2.2rem;font-weight:600;color:var(--gold2)}
.prog{height:6px;border-radius:4px;background:#1c212c;overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:pp 1.6s ease-in-out infinite}@keyframes pp{0%{margin-left:-30%}100%{margin-left:100%}}
@media(prefers-reduced-motion:reduce){.prog i{animation:none;width:100%}}
</style></head><body>
<nav><div class="wrap"><a class="logo" href="index.html">PureFx<span>Ai</span> <small class="mut" style="font-size:.8rem">Studio</small></a><div class="nr"><a class="btn o s" href="index.html" data-t="home"></a><a class="btn o s" href="learn.html" data-t="cls"></a><div class="lang"><button data-l="th">TH</button><button data-l="en">EN</button></div></div></div></nav>
<main class="wrap">
<h1 class="pg" data-t="h"></h1><p class="mut" id="subT"></p><div class="ktabs" id="kt"></div>
<div class="st"><div><form class="card" id="f" autocomplete="off">
 <label data-t="img"></label><label class="drop" id="dz"><input type="file" id="fi" name="image" accept="image/jpeg,image/png,image/webp" hidden required><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span id="dzt" data-t="pick"></span></label>
 <label data-t="pr"></label><textarea name="prompt" id="pr" rows="4" maxlength="600" required></textarea>
 <label data-t="dur"></label><div class="durs"></div>

</form>
<form class="card" id="fm" autocomplete="off" hidden>
 <label data-t="style"></label><input name="style" id="sty" maxlength="400" required>
 <label data-t="lyr"></label><div class="hlp" id="hlp"></div><textarea name="lyrics" id="lyr" rows="9" maxlength="3000"></textarea>
 <label data-t="dur"></label><div class="durs" id="mdur"></div>
 <label class="chk"><input type="checkbox" name="agree" value="1" required><span data-t="termsM"></span></label>
 <div class="msgx"></div><button class="btn gob" data-t="genM"></button><p class="mut limx" style="font-size:.82rem;margin-top:10px"></p></form>
<form class="card" id="fi2" autocomplete="off" hidden>
 <div class="soonbox" id="isoon"><b data-t="soon"></b><p class="mut" data-t="soonT"></p></div>
 <div id="iform"><label data-t="ipr"></label><textarea name="prompt" id="ipr" rows="5" maxlength="800" required></textarea>
 <label data-t="asp"></label><div class="durs" id="iasp"></div>
 <label class="chk"><input type="checkbox" name="agree" value="1" required><span data-t="termsI"></span></label>
 <div class="msgx"></div><button class="btn gob" data-t="genI"></button><p class="mut limx" style="font-size:.82rem;margin-top:10px"></p></div></form></div>
<section class="card" id="out"><h3 data-t="res"></h3><p class="mut" data-t="resHint"></p></section></div>
</main>
<script>
const T={th:{kv:"วิดีโอ",km:"เพลง",ki:"ภาพ",subv:"PureFxAi Video Engine - อัปโหลดภาพ 1 ภาพ บอกว่าอยากให้เคลื่อนไหวอย่างไร แล้วรับวิดีโอสั้นได้เลย ไม่ต้องล็อกอิน",subm:"PureFxAi Music Engine - บอกสไตล์เพลง ใส่เนื้อร้องไทยหรืออังกฤษ แล้วรับเพลง MP3 ได้เลย ไม่ต้องล็อกอิน",subi:"PureFxAi Image Engine - พิมพ์คำบรรยาย แล้วรับภาพคุณภาพสูง",style:"สไตล์เพลง เช่น ป๊อปไทยสดใส 100 BPM เสียงร้องหญิง กีตาร์อะคูสติก",lyr:"เนื้อร้อง (ไม่บังคับ เว้นว่าง = ดนตรีล้วน)",termsM:"ฉันยืนยันว่าเนื้อร้องเป็นของฉันหรือได้รับอนุญาต ไม่ลอกเลียนเพลงหรือเสียงศิลปินจริง ไม่มีเนื้อหาทางเพศ ความรุนแรง หรือเกี่ยวกับผู้เยาว์ และผลลัพธ์จะถูกลบภายใน 24 ชั่วโมง",genM:"สร้างเพลง",ipr:"คำบรรยายภาพ (ไทยหรืออังกฤษ)",asp:"สัดส่วนภาพ",termsI:"ฉันยอมรับว่าจะไม่สร้างภาพบุคคลจริง เนื้อหาทางเพศ ความรุนแรง หรือเกี่ยวกับผู้เยาว์ และผลลัพธ์จะถูกลบภายใน 24 ชั่วโมง",genI:"สร้างภาพ",soon:"เร็วๆ นี้",soonT:"ระบบสร้างภาพกำลังเตรียมพร้อม เปิดให้ใช้เร็วๆ นี้",dlm:"ดาวน์โหลด MP3",dli:"ดาวน์โหลดภาพ",home:"หน้าแรก",cls:"ห้องเรียน",h:"สตูดิโอ AI ฟรี",img:"ภาพต้นฉบับ (JPG / PNG / WEBP ไม่เกิน 8 MB)",pick:"แตะเพื่อเลือกภาพ",pr:"คำสั่ง (ไทยหรืออังกฤษ) เช่น กล้องค่อยๆ ซูมเข้า ผู้หญิงยิ้มและหันมามองกล้อง ผมพลิ้วตามลม",dur:"ความยาว",terms:"ฉันยืนยันว่ามีสิทธิ์ใช้ภาพนี้ ไม่ใช้ภาพบุคคลจริงโดยไม่ได้รับอนุญาต ไม่สร้างเนื้อหาทางเพศ ความรุนแรง หรือเกี่ยวกับผู้เยาว์ และยอมรับว่าผลลัพธ์จะถูกลบภายใน 24 ชั่วโมง",gen:"สร้างวิดีโอ",res:"ผลลัพธ์",resHint:"ผลงานของคุณจะแสดงที่นี่ (เก็บไว้ 24 ชั่วโมง)",left:"สิทธิ์วันนี้เหลือ",queued:"อยู่ในคิว ลำดับที่",waiting:"รอเครื่องว่าง (งานผลิตของทีมได้สิทธิ์ก่อน)",running:"กำลังสร้าง...",eta:"เวลาโดยประมาณ",min:"นาที",done:"เสร็จแล้ว",dl:"ดาวน์โหลดวิดีโอ",exp:"ลิงก์หมดอายุ",again:"สร้างใหม่",
 e:{disabled:"ระบบปิดให้บริการชั่วคราว",ip_limit:"วันนี้คุณใช้สิทธิ์ครบแล้ว กลับมาใหม่พรุ่งนี้",daily_cap:"วันนี้มีผู้ใช้ครบโควตาแล้ว กลับมาใหม่พรุ่งนี้",queue_full:"คิวเต็ม ลองใหม่ภายหลัง",too_large:"ไฟล์ใหญ่เกิน 8 MB",no_image:"กรุณาเลือกภาพ",bad_image:"ไฟล์ภาพไม่ถูกต้อง (ต้องเป็น JPG/PNG/WEBP ขนาด 256-6000 px)",terms:"กรุณายอมรับเงื่อนไข",no_prompt:"กรุณาพิมพ์คำสั่ง",blocked_prompt:"คำสั่งนี้ขัดกับนโยบาย (เนื้อหาทางเพศ ผู้เยาว์ ความรุนแรง หรือบุคคลจริง)",render_failed:"สร้างไม่สำเร็จ ลองคำสั่งอื่นอีกครั้ง",not_found:"ไม่พบงานนี้ หรือหมดอายุแล้ว",x:"เกิดข้อผิดพลาด ลองใหม่อีกครั้ง"}},
en:{kv:"Video",km:"Music",ki:"Image",subv:"PureFxAi Video Engine - upload one image, describe the motion, get a short video. No login needed.",subm:"PureFxAi Music Engine - describe a style, add Thai or English lyrics, get an MP3 song. No login needed.",subi:"PureFxAi Image Engine - describe a picture and get a high-quality image.",style:"Music style, e.g. bright Thai pop, 100 BPM, female vocal, acoustic guitar",lyr:"Lyrics (optional, empty = instrumental)",termsM:"I confirm the lyrics are mine or licensed, I will not imitate real songs or artists' voices, no sexual, violent or minor-related content. Results are deleted after 24 hours.",genM:"Generate song",ipr:"Image description (Thai or English)",asp:"Aspect ratio",termsI:"I will not create images of real people, sexual, violent or minor-related content. Results are deleted after 24 hours.",genI:"Generate image",soon:"Coming soon",soonT:"The image engine is being prepared and will open soon.",dlm:"Download MP3",dli:"Download image",home:"Home",cls:"Classroom",h:"Free AI Studio",img:"Source image (JPG / PNG / WEBP, max 8 MB)",pick:"Tap to choose an image",pr:"Prompt (Thai or English), e.g. slow camera push-in, the woman smiles and turns to the camera, hair moving in the wind",dur:"Duration",terms:"I confirm I have the right to use this image, will not use real people without consent, and will not create sexual, violent or minor-related content. Results are deleted after 24 hours.",gen:"Generate video",res:"Result",resHint:"Your result will appear here (kept for 24 hours)",left:"Free generations left today",queued:"In queue, position",waiting:"Waiting for a free slot (team production jobs have priority)",running:"Generating...",eta:"Estimated time",min:"min",done:"Done",dl:"Download video",exp:"Link expires",again:"Create another",
 e:{disabled:"The generator is temporarily offline",ip_limit:"You have used today's free generations. Come back tomorrow.",daily_cap:"Today's free quota is used up. Come back tomorrow.",queue_full:"The queue is full, please try later",too_large:"File is larger than 8 MB",no_image:"Please choose an image",bad_image:"Invalid image (JPG/PNG/WEBP, 256-6000 px)",terms:"Please accept the terms",no_prompt:"Please enter a prompt",blocked_prompt:"This prompt violates our policy (sexual, minors, violence or real people)",render_failed:"Generation failed, please try another prompt",not_found:"Job not found or expired",x:"Something went wrong, please try again"}}};
let L=new URLSearchParams(location.search).get('lang')||localStorage.getItem('pfx_lang')||'th';const t=k=>T[L][k]||k,E=k=>T[L].e[k]||T[L].e.x;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
document.querySelector('.durs').innerHTML=[5,10,15].map((d,i)=>`<label><input type="radio" name="duration" value="${d}" ${i==0?'checked':''}><span>${d}s</span></label>`).join('');
let CFG={},K=(location.hash.slice(1)||'video'),cur=localStorage.getItem('pfx_studio_job'),curK=localStorage.getItem('pfx_studio_kind')||'video',timer;if(!['video','music','image'].includes(K))K='video';
const FORMS={video:f,music:fm,image:fi2};
mdur.innerHTML=[30,60].map((d,i)=>`<label><input type="radio" name="duration" value="${d}" ${i==0?'checked':''}><span>${d}s</span></label>`).join('');
iasp.innerHTML=['1:1','9:16','16:9'].map((d,i)=>`<label><input type="radio" name="aspect" value="${d}" ${i==0?'checked':''}><span>${d}</span></label>`).join('');
hlp.innerHTML=['[Intro]','[Verse]','[Pre-Chorus]','[Chorus]','[Bridge]','[Outro]','[Instrumental]'].map(x=>`<button type="button">${x}</button>`).join('');hlp.querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=lyr.selectionStart||lyr.value.length;lyr.value=lyr.value.slice(0,p)+(p&&lyr.value[p-1]!='\n'?'\n':'')+b.textContent+'\n'+lyr.value.slice(p);lyr.focus()});
function tabs(){kt.innerHTML=['video','music','image'].map(k=>`<button class="${K==k?'on':''}" data-k="${k}">${t(k=='video'?'kv':k=='music'?'km':'ki')}${k=='image'&&CFG.image&&CFG.image.soon?` <small>(${t('soon')})</small>`:''}</button>`).join('');kt.querySelectorAll('button').forEach(b=>b.onclick=()=>{K=b.dataset.k;history.replaceState(null,'','#'+K);apply()});
 for(const k in FORMS)FORMS[k].hidden=k!=K;subT.textContent=t(K=='video'?'subv':K=='music'?'subm':'subi');const c=CFG[K]||{};
 if(K=='image'){isoon.hidden=!c.soon;iform.hidden=!!c.soon}
 const fo=FORMS[K],lm=fo.querySelector('.limx')||lim,bt=fo.querySelector('.gob')||go;lm.textContent=c.enabled?`${t('left')}: ${c.remaining}/${c.perIp}`:(c.soon?'':E('disabled'));bt.disabled=!c.enabled||!c.remaining}
function apply(){document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));pr.placeholder=t('pr');document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));sty.placeholder=t('style');ipr.placeholder=t('ipr');tabs();if(fi.files[0])dzt.textContent=fi.files[0].name;if(cur)poll()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('pfx_lang',L);apply()});
fi.onchange=()=>{const x=fi.files[0];if(!x)return;if(x.size>8*1024*1024){msg.innerHTML=`<div class="msg err">${E('too_large')}</div>`;fi.value='';return}
 dz.classList.add('has');dz.querySelector('img')?.remove();const im=new Image();im.src=URL.createObjectURL(x);dz.prepend(im);dzt.textContent=x.name;msg.innerHTML=''};
async function cfg(){try{CFG=await (await fetch('/api/studio/config')).json()}catch(e){CFG={}}apply()}
for(const k in FORMS)FORMS[k].onsubmit=async e=>{e.preventDefault();const fo=FORMS[k],mx=fo.querySelector('.msgx')||msg,bt=fo.querySelector('.gob')||go;mx.innerHTML='';bt.disabled=true;
 try{const r=await fetch('/api/studio/jobs/'+k,{method:'POST',headers:{'x-pfx':'1'},body:new FormData(fo)});const j=await r.json().catch(()=>({}));
  if(!r.ok){mx.innerHTML=`<div class="msg err">${esc(E(j.error))}</div>`;bt.disabled=false;return}cur=j.token;curK=k;localStorage.setItem('pfx_studio_job',cur);localStorage.setItem('pfx_studio_kind',k);show(j);poll();cfg()}catch(e){mx.innerHTML=`<div class="msg err">${E('x')}</div>`;bt.disabled=false}};
function show(j){const eta=Math.max(1,Math.round((j.eta||0)/60));
 if(j.status=='done'){const kk=j.kind||curK,src='/api/studio/result/'+cur;out.innerHTML=`<h3>${t('done')}</h3>${kk=='music'?`<audio controls autoplay src="${src}"></audio>`:kk=='image'?`<img class="resimg" src="${src}" alt="">`:`<video controls playsinline autoplay loop src="${src}"></video>`}<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><a class="btn" href="${src}?dl=1">${t(kk=='music'?'dlm':kk=='image'?'dli':'dl')}</a><button class="btn o" id="ag">${t('again')}</button></div><p class="mut" style="font-size:.8rem;margin-top:8px">${t('exp')}: ${new Date(j.expires).toLocaleString(L=='th'?'th-TH':'en-GB')}</p>`;ag.onclick=()=>{localStorage.removeItem('pfx_studio_job');cur=null;out.innerHTML=`<h3>${t('res')}</h3><p class="mut">${t('resHint')}</p>`;cfg()};return}
 if(j.status=='failed'){out.innerHTML=`<h3>${t('res')}</h3><div class="msg err">${E(j.error)}</div>`;localStorage.removeItem('pfx_studio_job');cur=null;return}
 out.innerHTML=`<h3>${j.status=='running'?t('running'):j.status=='waiting'?t('waiting'):t('queued')+' '+j.position}</h3>${j.status!='running'&&j.position?`<div class="big">#${j.position}</div>`:''}<div class="prog"><i></i></div><p class="mut">${t('eta')}: ~${eta} ${t('min')}</p>`}
async function poll(){clearTimeout(timer);if(!cur)return;try{const r=await fetch('/api/studio/jobs/'+cur);const j=await r.json();if(!r.ok){out.innerHTML=`<h3>${t('res')}</h3><div class="msg err">${E(j.error)}</div>`;localStorage.removeItem('pfx_studio_job');cur=null;return}show(j);if(j.status!='done'&&j.status!='failed')timer=setTimeout(poll,5000)}catch(e){timer=setTimeout(poll,8000)}}
cfg();
</script></body></html>
