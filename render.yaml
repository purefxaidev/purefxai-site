services:
  - type: web
    name: purefxai
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_EMAIL
        value: pureai.com@gmail.com
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # DATA_DIR: on the free plan the disk is ephemeral (wiped on every deploy/restart).
      # Upgrade + attach a Render Disk mounted at /var/data and set DATA_DIR=/var/data,
      # or move members/orders/slips to a managed DB/object store.
