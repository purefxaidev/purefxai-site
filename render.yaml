services:
  - type: web
    name: purefxai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ADMIN_EMAIL
        value: pureai.com@gmail.com
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://purefxai.onrender.com
      - key: COMFY_URL
        sync: false
      - key: STUDIO_SALT
        sync: false
      # DATA_DIR: on the free plan the disk is ephemeral (wiped on every deploy/restart).
      # Upgrade + attach a Render Disk mounted at /var/data and set DATA_DIR=/var/data,
      # or move members/orders/slips to a managed DB/object store.
