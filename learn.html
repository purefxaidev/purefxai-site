<style>
.auth{max-width:440px;margin:50px auto}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1;background:none;border:1px solid #2c3343;color:var(--mut);padding:10px;border-radius:10px;cursor:pointer;font-family:inherit}.tabs button.on{border-color:var(--gold);color:var(--gold)}
.cc{display:flex;flex-direction:column;gap:10px}.cc.lock{opacity:.75}.cc h3{font-size:1.1rem}
.room{display:grid;grid-template-columns:300px 1fr;gap:22px;margin:20px 0 60px}.side{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.mod{margin-bottom:14px}.mod b{display:block;font-size:.8rem;color:var(--gold);letter-spacing:.5px;margin-bottom:6px}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--txt);padding:9px 10px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:.92rem}.li:hover{background:rgba(232,184,74,.06)}.li.on{border-color:var(--gold);background:rgba(232,184,74,.08)}
.li .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid #3a4152;flex:0 0 auto;display:flex;align-items:center;justify-content:center}.li.done .ck{background:var(--ok);border-color:var(--ok);color:#0b0d12}
video{width:100%;border-radius:14px;background:#000;aspect-ratio:16/9;display:block}
.slot{font-size:.78rem;margin-top:6px}.opt{display:block;width:100%;text-align:left;background:rgba(16,19,27,.8);border:1px solid #2c3343;color:var(--txt);padding:11px 14px;border-radius:10px;margin:7px 0;cursor:pointer;font-family:inherit;font-size:.95rem}.opt.ok{border-color:var(--ok);background:rgba(62,207,122,.1)}.opt.bad{border-color:var(--bad);background:rgba(224,90,90,.1)}
.bank{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.95rem}.acc{font-size:1.4rem;font-weight:600;color:var(--gold2);letter-spacing:1px}
.ctabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin:18px 0 6px}.ctabs a{flex:0 0 auto;padding:7px 16px;border-radius:20px;border:1px solid #2c3343;color:var(--mut);font-size:.9rem;white-space:nowrap}.ctabs a.on{border-color:var(--gold);color:#111;background:linear-gradient(135deg,var(--gold),var(--gold2))}
.tag.free{background:rgba(70,200,120,.14);border-color:#3fbf7a;color:#7fe0a8}.new{display:inline-block;background:linear-gradient(135deg,#ff6a4a,#e8b84a);color:#111;font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:10px;letter-spacing:.5px;margin-left:6px;vertical-align:2px}.dt{font-size:.75rem;color:var(--mut);display:block}
.pk{cursor:pointer;text-align:center}.pk.on{box-shadow:0 0 0 2px var(--gold),0 14px 40px -14px rgba(232,184,74,.6)}.pk input{display:none}
.drop{border:1.5px dashed #3a4152;border-radius:14px;padding:22px;text-align:center;cursor:pointer;color:var(--mut)}.drop.has{border-color:var(--gold);color:var(--txt)}
@media(max-width:900px){.room{grid-template-columns:1fr}.side{position:static;max-height:none}}
</style></head><body>

async function api(p,o={}){const r=await fetch('/api/lms/'+p,{...o,headers:{'x-pfx':'1',...(o.json?{'content-type':'application/json'}:{}),...(o.headers||{})},body:o.json?JSON.stringify(o.json):o.body,credentials:'same-origin'});let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,...j}}

async function route(){CFG=CFG||await api('config');const me=await api('me');ME=me.ok?me.user:null;const h=location.hash.slice(1)||'dash';chrome();

function viewAuth(mode){app.innerHTML=`<div class="auth card"><div class="tabs"><button class="${mode=='login'?'on':''}" onclick="location.hash='#login'">${t('login')}</button><button class="${mode=='signup'?'on':''}" onclick="location.hash='#signup'">${t('signup')}</button></div>

 <div id="am"></div><button class="btn" style="width:100%;justify-content:center;margin-top:14px">${t(mode)}</button></form>${mode=='login'?`<p style="margin-top:12px;text-align:center"><a href="#" id="fg">${t('forgot')}</a></p>`:''}</div>`;

function viewReset(tok){app.innerHTML=`<div class="auth card"><h3>${t('setpw')}</h3><form id="rf"><label>${t('newpw')}</label><input type="password" name="password" minlength="8" required><div id="rm"></div><button class="btn" style="margin-top:14px">${t('setpw')}</button></form></div>`;
 rf.onsubmit=async e=>{e.preventDefault();const r=await api('reset',{method:'POST',json:{token:tok,password:rf.password.value}});rm.innerHTML=r.ok?`<div class="msg okm">${t('resetOk')}</div>`:`<div class="msg err">${esc(E(r.error))}</div>`;if(r.ok)setTimeout(()=>location.hash='#login',1500)}}
const FREEB=`<span class="tag free">${L=='th'?'ดูฟรี':'FREE'}</span>`,lockCTA=()=>`<div class="card lockc" style="text-align:center;padding:34px 20px"><div style="font-size:2rem;color:var(--gold)">${IC.lock}</div><h3>${L=='th'?'บทเรียนนี้สำหรับสมาชิกแพ็กเกจ':'This lesson is for package members'}</h3><p class="mut">${L=='th'?'ดูบทเรียนตัวอย่างฟรีได้ หรือสมัครสมาชิกและเลือกแพ็กเกจเพื่อปลดล็อกทุกบท':'Watch the free preview lessons, or sign up and choose a package to unlock everything.'}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px">${ME?'':`<a class="btn" href="#signup">${t('signup')}</a>`}<a class="btn ${ME?'':'o'}" href="#checkout">${t('unlock')}</a></div></div>`;

 ${!ME?'<div style="height:60px"></div>':`<h2 style="margin:34px 0 12px">${t('orders')}</h2><div class="card tw"><table><tr><th>#</th><th>${L=='th'?'แพ็กเกจ':'Package'}</th><th>${t('amount')}</th><th>${L=='th'?'สถานะ':'Status'}</th><th></th></tr>${(orders||[]).map(o=>`<tr><td>${o.id.slice(0,8)}</td><td>${PK[o.package]}</td><td>${o.amount?'฿'+o.amount.toLocaleString():'-'}</td><td><span class="tag ${o.status=='approved'?'ok':o.status=='rejected'?'bad':''}">${t(o.status)}</span></td><td class="mut">${new Date(o.created).toLocaleString(L=='th'?'th-TH':'en-GB')}${o.reason?'<br>'+esc(o.reason):''}</td></tr>`).join('')||`<tr><td colspan="5" class="mut">-</td></tr>`}</table></div><div style="height:60px"></div>`}`}
async function viewCourse(cid,lid){const r=await api('courses/'+cid);if(!r.course)return location.hash='#dash';const c=r.course;
 const ls=c.modules.flatMap(m=>m.lessons);ls.forEach(l=>l.state=l.state||{});const cur=ls.find(l=>l.id==lid)||(c.access?ls.find(l=>!l.state.done):ls.find(l=>!l.locked))||ls[0];
 app.innerHTML=`<h1 class="pg">${esc(c[L])}</h1>${c.access?`<div class="mut"><span id="pp">${c.progress.pct}</span>% · ${c.progress.done}/${c.progress.total} ${t('lessons')}</div>`:`<div class="msg">${L=='th'?'โหมดทดลองดูฟรี - บทที่มีป้าย ดูฟรี เปิดดูได้เลย':'Free preview mode - lessons marked FREE are open'} <a href="${ME?'#checkout':'#signup'}">${t('unlock')}</a></div>`}<div class="room"><aside class="card side">${c.modules.map(m=>`<div class="mod"><b>${esc(m[L])}</b>${m.lessons.map(l=>`<button class="li ${l.id==cur.id?'on':''} ${l.state.done?'done':''}" onclick="location.hash='#course/${c.id}/${l.id}'"><span class="ck">${l.locked?IC.lock:l.state.done?IC.check:''}</span>${TI[l.type]||''}<span>${esc(l[L])}${l.date&&isNew(l.date)?NEWB:''}${!c.access&&l.free?' '+FREEB:''}${l.date?`<span class="dt">${new Date(l.date).toLocaleDateString(L=='th'?'th-TH':'en-GB',{dateStyle:'medium'})}</span>`:''}</span></button>`).join('')}</div>`).join('')}
 <div style="margin-top:12px">${!c.access?`<a class="btn s" href="${ME?'#checkout':'#signup'}">${t('unlock')}</a>`:c.progress.pct==100?`<a class="btn" target="_blank" href="/api/lms/cert/${c.id}?lang=${L}">${t('cert')}</a>`:`<p class="mut" style="font-size:.85rem">${t('certNeed')}</p>`}</div></aside><section id="lz"></section></div>`;
 const l=cur,key=c.id+'/'+l.id;if(l.locked){lz.innerHTML=`<div class="card"><h2 style="margin:0 0 14px">${IC.lock} ${esc(l[L])}</h2></div>`+lockCTA();return}let html=`<div class="card"><span class="tag">${TI[l.type]||''} ${t('type')[l.type]||l.type}</span><h2 style="margin:8px 0 14px">${esc(l[L])}</h2>`;
 if(l.video)html+=`<video id="vd" controls playsinline preload="metadata" src="/api/lms/media/${c.id}/${l.id}"></video>${l.standIn?`<div class="slot ph">${t('slot')} (server/lms-media/lessons/${c.id}/${l.id}.mp4)</div>`:''}`;
 html+=`<h3 style="margin:18px 0 6px">${t('notes')}</h3><p style="white-space:pre-line">${esc(l['notes_'+L]).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener nofollow">$1</a>')}</p>`;
 if(l.file)html+=`<p style="margin-top:14px"><a class="btn o s" href="/api/lms/files/${c.id}/${l.id}">${IC.dl} ${t('download')}</a></p>`;
 if(l.task)html+=`<h3 style="margin:18px 0 6px">${t('task')}</h3><textarea id="tk" rows="5" maxlength="5000" placeholder="${t('taskPh')}">${esc(l.state.submission||'')}</textarea><button class="btn s" id="tkb" style="margin-top:8px">${t('task')}</button> <span id="tkm" class="mut"></span>`;
 if(l.quiz&&l.quiz[L])html+=`<h3 style="margin:22px 0 6px">${t('ex')}</h3><div id="qz"></div>`;
 html+=`<div style="margin-top:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${c.access?'':`<a class="btn o" href="${ME?'#checkout':'#signup'}">${t('unlock')}</a>`}<button class="btn" ${c.access?'':'style="display:none"'} id="dn" ${l.state.done?'disabled':''}>${l.state.done?t('done'):t('markDone')}</button></div></div>`;lz.innerHTML=html;
 const post=b=>!c.access?Promise.resolve({ok:true}):api(`progress/${c.id}/${l.id}`,{method:'POST',json:b});
 dn.onclick=async()=>{const r=await post({done:true});if(r.ok){const nx=ls[ls.indexOf(l)+1];location.hash=nx?`#course/${c.id}/${nx.id}`:`#course/${c.id}/${l.id}`;if(!nx)route()}};
 if(window.vd){let last=0;vd.addEventListener('loadedmetadata',()=>{if(l.state.pos&&l.state.pos<vd.duration-2)vd.currentTime=l.state.pos});
  vd.addEventListener('timeupdate',()=>{if(Date.now()-last<5000)return;last=Date.now();post({pos:vd.currentTime,watched:Math.round(vd.currentTime/vd.duration*100)})});
  vd.addEventListener('ended',()=>post({pos:0,watched:100}))}
 if(window.tkb)tkb.onclick=async()=>{const r=await post({submission:tk.value,done:!!tk.value.trim()});tkm.textContent=r.ok?t('saved'):''};
 if(window.qz){const qs=l.quiz[L];let i=0,sc=0;const draw=()=>{if(i>=qs.length){qz.innerHTML=`<div class="msg okm">${sc}/${qs.length}</div>`;post({score:sc/qs.length*100});return}const q=qs[i];
  qz.innerHTML=`<p><b>${i+1}/${qs.length}</b> ${esc(q[0])}</p>${q[1].map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}<div id="qf"></div>`;
  qz.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(qz.dataset.a==i)return;qz.dataset.a=i;const j=+b.dataset.j,ok=j==q[2];qz.querySelectorAll('.opt')[q[2]].classList.add('ok');if(!ok)b.classList.add('bad');if(ok)sc++;
   qf.innerHTML=`<div class="msg ${ok?'okm':'err'}">${ok?t('correct'):t('wrong')}: ${esc(q[3])}</div><button class="btn s">${L=='th'?'ต่อไป':'Next'}</button>`;qf.querySelector('button').onclick=()=>{i++;draw()}})};draw()}}
function viewCheckout(sel){const pr=CFG.prices,b=CFG.bank;sel=sel||'pro';
 app.innerHTML=`<h1 class="pg">${t('checkout')}</h1><div class="card" style="margin:18px 0"><h3>${t('pick')}</h3><div class="grid" style="margin-top:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${CFG.packages.map(p=>`<label class="card pk ${p==sel?'on':''}" style="margin:0"><input type="radio" name="pk" value="${p}" ${p==sel?'checked':''}><b style="color:var(--txt);font-size:1.05rem">${PK[p]}</b><div style="color:var(--gold2);font-size:1.2rem;font-weight:600">${pr[p]?'฿'+Number(pr[p]).toLocaleString():'฿X,XXX'}</div></label>`).join('')}</div></div>
 <div class="card" style="margin:18px 0"><h3>${t('pay')}</h3><div style="margin:10px 0 14px"><span class="mut">${t('amount')}:</span> <b id="amt" style="color:var(--gold2);font-size:1.3rem"></b></div>
 <div class="bank"><span class="mut">${t('bankL')}</span><b>${L=='th'?b.bank_th:b.bank_en}</b><span class="mut">${t('accName')}</span><b>${esc(b.name)}</b><span class="mut">${t('accNo')}</span><div><span class="acc">${b.number}</span> <button class="btn o s" id="cp">${IC.copy} <span>${t('copy')}</span></button></div></div></div>
 <form class="card" id="of" style="margin:18px 0 60px"><h3>${t('up')}</h3><label class="drop" id="dz" style="margin-top:12px"><input type="file" name="slip" id="sf" accept="image/jpeg,image/png,image/webp,application/pdf" hidden><span id="dzt">${t('upHint')}</span></label>
 <label>${t('note')}</label><textarea name="note" rows="2" maxlength="500"></textarea><div id="om"></div><button class="btn" style="margin-top:14px">${t('submit')}</button></form>`;
 const amt=()=>{const p=document.querySelector('[name=pk]:checked').value;amtEl.textContent=pr[p]?'฿'+Number(pr[p]).toLocaleString():t('amountTBA');document.querySelectorAll('.pk').forEach(x=>x.classList.toggle('on',x.querySelector('input').checked))};const amtEl=amt.el=document.getElementById('amt');
 document.querySelectorAll('[name=pk]').forEach(x=>x.onchange=amt);amt();
 cp.onclick=async e=>{e.preventDefault();try{await navigator.clipboard.writeText(b.raw)}catch(x){const ta=document.createElement('textarea');ta.value=b.raw;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove()}cp.querySelector('span').textContent=t('copied');setTimeout(()=>cp.querySelector('span').textContent=t('copy'),1500)};
 sf.onchange=()=>{const f=sf.files[0];om.innerHTML='';if(!f)return;if(f.size>5*1024*1024){om.innerHTML=`<div class="msg err">${E('file_too_large')}</div>`;sf.value='';return}if(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(f.type)){om.innerHTML=`<div class="msg err">${E('invalid_file_type')}</div>`;sf.value='';return}dz.classList.add('has');dzt.textContent=f.name+' ('+(f.size/1024).toFixed(0)+' KB)'};
 of.onsubmit=async e=>{e.preventDefault();const fd=new FormData();fd.append('package',document.querySelector('[name=pk]:checked').value);fd.append('note',of.note.value);if(sf.files[0])fd.append('slip',sf.files[0]);
  const btn=of.querySelector('button');btn.disabled=true;const r=await api('orders',{method:'POST',body:fd});btn.disabled=false;om.innerHTML=r.ok?`<div class="msg okm">${t('submitted')}</div>`:`<div class="msg err">${esc(E(r.error))}</div>`;if(r.ok){of.reset();dz.classList.remove('has');dzt.textContent=t('upHint')}}}
route();
</script></body></html>
