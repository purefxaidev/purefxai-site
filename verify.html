<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Certificate - PureFxAi</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Cinzel:wght@700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2a2410,#0b0d12 60%);color:#e9ecf2;font-family:Kanit,sans-serif}
nav{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:auto;padding:20px}.logo{font-weight:600;font-size:1.3rem;color:#fff;text-decoration:none}.logo span{color:#e8b84a}
.lang button{background:none;border:1px solid #3a3f4c;color:#9aa3b2;padding:5px 10px;font-family:inherit;cursor:pointer}.lang button.on{background:#e8b84a;color:#111;border-color:#e8b84a}
main{max-width:820px;margin:auto;padding:10px 20px 60px}h1{font-weight:600;margin:10px 0 4px}.mut{color:#9aa3b2}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(232,184,74,.35);border-radius:16px;padding:28px;margin-top:22px}
.st{display:flex;align-items:center;gap:14px;font-size:1.4rem;font-weight:600}.st svg{width:44px;height:44px;flex:none}
.ok{color:#5fd38a}.bad{color:#ff6b6b}.warn{color:#f0b45a}dl{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;margin:22px 0 0}dt{color:#9aa3b2}dd{margin:0;font-weight:400}
form{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:220px;padding:12px 14px;border-radius:10px;border:1px solid #3a3f4c;background:#12151c;color:#fff;font-family:inherit;font-size:1rem}
button.go{padding:12px 22px;border-radius:10px;border:0;background:#e8b84a;color:#111;font-family:inherit;font-weight:600;cursor:pointer}.tag{display:inline-block;background:#a01e1e;color:#fff;font-size:.75rem;padding:3px 10px;margin-left:8px;letter-spacing:1px}
@media(max-width:560px){dl{grid-template-columns:1fr}dt{margin-top:6px}}
</style></head><body>
<nav><a class="logo" href="index.html">PureFx<span>Ai</span></a><div class="lang"><button data-l="th">TH</button><button data-l="en">EN</button></div></nav>
<main><div style="font-family:Cinzel,serif;letter-spacing:5px;color:#e8b84a;font-size:.85rem">PUREFXAI ACADEMY</div><h1 id="h"></h1><p class="mut" id="sub"></p>
<div class="card" id="res" hidden></div>
<div class="card"><h3 id="lk" style="margin-top:0"></h3><form id="f"><input id="q" autocomplete="off"><button class="go" id="b"></button></form></div></main>
<script>
const T={th:{h:"ตรวจสอบประกาศนียบัตร",sub:"ยืนยันความถูกต้องของประกาศนียบัตรที่ออกโดย PureFxAi Academy",lk:"ค้นหาด้วยรหัสประกาศนียบัตร",ph:"เช่น PFX-AI-BASICS-1A2B3C4D",b:"ตรวจสอบ",valid:"ประกาศนียบัตรถูกต้อง",revoked:"ประกาศนียบัตรถูกเพิกถอน",invalid:"ไม่พบประกาศนียบัตรนี้",invalidD:"รหัสไม่ถูกต้องหรือไม่มีในระบบ",name:"ชื่อผู้รับ",course:"หลักสูตร",date:"วันที่ออก",id:"รหัสประกาศนียบัตร",load:"กำลังตรวจสอบ...",sample:"ตัวอย่าง / SAMPLE"},
en:{h:"Certificate Verification",sub:"Confirm the authenticity of a certificate issued by PureFxAi Academy",lk:"Look up by certificate ID",ph:"e.g. PFX-AI-BASICS-1A2B3C4D",b:"Verify",valid:"Valid certificate",revoked:"Certificate revoked",invalid:"Certificate not found",invalidD:"The code is incorrect or does not exist",name:"Recipient",course:"Course",date:"Issue date",id:"Certificate ID",load:"Checking...",sample:"SAMPLE"}};
let L=localStorage.getItem('pfx_lang')||'th',last=null;const t=k=>T[L][k],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m7 12 3.5 3.5L17 9"/></svg>',bad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m8 8 8 8M16 8l-8 8"/></svg>',warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18v.5"/></svg>'};
function ui(){document.documentElement.lang=L;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));['h','sub','lk','b'].forEach(k=>document.getElementById(k).textContent=t(k));q.placeholder=t('ph');if(last)show(last)}
function show(s){last=s;res.hidden=false;if(s==='load'){res.innerHTML=`<p class="mut">${t('load')}</p>`;return}
 if(!s.cert){res.innerHTML=`<div class="st bad">${I.bad}${t('invalid')}</div><p class="mut">${t('invalidD')}</p>`;return}
 const c=s.cert,ok=c.status==='valid',d=new Date(c.issued).toLocaleDateString(L==='en'?'en-GB':'th-TH',{year:'numeric',month:'long',day:'numeric'});
 res.innerHTML=`<div class="st ${ok?'ok':'warn'}">${ok?I.ok:I.warn}${t(ok?'valid':'revoked')}${s.sample?`<span class="tag">${t('sample')}</span>`:''}</div><dl><dt>${t('name')}</dt><dd>${esc(c.name)}</dd><dt>${t('course')}</dt><dd>${esc(L==='en'?c.courseEn||c.courseTh:c.courseTh)}</dd><dt>${t('date')}</dt><dd>${d}</dd><dt>${t('id')}</dt><dd>${esc(c.id)}</dd></dl>`}
async function look(code){code=String(code||'').trim();if(!code)return;
 if(/^(sample|PFX-SAMPLE-0001)$/i.test(code))return show({sample:1,cert:{id:'PFX-SAMPLE-0001',name:'สมชาย ใจดี',courseTh:'AI พื้นฐาน',courseEn:'AI Fundamentals',issued:'2026-10-20',status:'valid'}});
 show('load');if(!/^[\w-]{6,64}$/.test(code))return show({});try{const r=await fetch('/api/lms/verify/'+encodeURIComponent(code));show(r.ok?await r.json():{})}catch(e){show({})}}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('pfx_lang',L);ui()});
f.onsubmit=e=>{e.preventDefault();look(q.value)};ui();const c=new URLSearchParams(location.search).get('c');if(c)look(c);
</script></body></html>
