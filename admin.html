<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PureFxAi Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="lms.css">
<style>
.lay{display:grid;grid-template-columns:220px 1fr;gap:22px;margin:22px 0 60px}.menu{position:sticky;top:80px;align-self:start;display:flex;flex-direction:column;gap:4px}
.menu button{display:flex;gap:10px;align-items:center;background:none;border:1px solid transparent;color:var(--txt);padding:10px 12px;border-radius:10px;cursor:pointer;font-family:inherit;text-align:left}.menu button.on,.menu button:hover{border-color:rgba(232,184,74,.5);background:rgba(232,184,74,.07);color:var(--gold2)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.st{display:flex;flex-direction:column;gap:4px}.st .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(232,184,74,.1);border:1px solid rgba(232,184,74,.3);color:var(--gold)}
.st b{font-size:1.6rem;font-family:Kanit}.st span{color:var(--mut);font-size:.82rem}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:18px}.chart svg{width:100%;height:200px}
.slipimg{max-width:100%;max-height:420px;border-radius:10px;border:1px solid #2c3343;display:block;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal .card{max-width:720px;width:100%;max-height:90vh;overflow:auto}
textarea.code{font-family:ui-monospace,monospace;font-size:13px;min-height:360px}
@media(max-width:900px){.lay{grid-template-columns:1fr}.menu{position:static;flex-direction:row;overflow-x:auto}.menu button{white-space:nowrap}.two{grid-template-columns:1fr}}
</style></head><body>
<nav><div class="wrap"><a class="logo" href="index.html">PureFx<span>Ai</span> <small class="mut" style="font-size:.8rem">Admin</small></a><div class="nr" id="navR"><div class="lang"><button data-l="th">TH</button><button data-l="en">EN</button></div></div></div></nav>
<main class="wrap" id="app"></main><div class="modal" id="md" onclick="if(event.target===md)md.classList.remove('open')"><div class="card" id="mdc"></div></div>
<script>
const T={th:{login:"เข้าสู่ระบบแอดมิน",email:"อีเมลแอดมิน",pw:"รหัสผ่าน",setup:"ตั้งรหัสผ่านแอดมินครั้งแรก",token:"Setup token (ดูใน log ของเซิร์ฟเวอร์)",newpw:"รหัสผ่านใหม่ (อย่างน้อย 10 ตัวอักษร)",logout:"ออกจากระบบ",
 dash:"ภาพรวม",orders:"คำสั่งซื้อ / สลิป",members:"สมาชิก",courses:"คอร์สและบทเรียน",shorts:"หนังสั้น",settings:"ตั้งค่าราคา",
 sMem:"สมาชิกทั้งหมด",sNew:"สมัครใหม่ 7 วัน",sPend:"สลิปรอตรวจ",sAppr:"คำสั่งซื้ออนุมัติ",sRevM:"รายได้เดือนนี้ (บาท)",sRevT:"รายได้รวม (บาท)",rev30:"รายได้ 30 วันล่าสุด",pendQ:"สลิปรอตรวจล่าสุด",recent:"สมาชิกใหม่ล่าสุด",enroll:"จำนวนผู้เรียนต่อคอร์ส",
 approve:"อนุมัติ",reject:"ไม่อนุมัติ",view:"ดูสลิป",amount:"ยอดเงิน (บาท)",reason:"เหตุผล (ไม่บังคับ)",status:"สถานะ",all:"ทั้งหมด",pending:"รอตรวจ",approved:"อนุมัติแล้ว",rejected:"ไม่อนุมัติ",search:"ค้นหาอีเมลหรือชื่อ",
 open:"เปิด",disable:"ระงับบัญชี",enable:"เปิดใช้งาน",grant:"ให้สิทธิ์",revoke:"ถอนสิทธิ์",pk:"แพ็กเกจ",savePk:"บันทึกแพ็กเกจ",save:"บันทึก",saved:"บันทึกแล้ว",newCourse:"เพิ่มคอร์สใหม่",del:"ลบ",
 likes:"ไลก์",comments:"ความคิดเห็น",delc:"ลบความคิดเห็น",prices:"ราคาแพ็กเกจ (บาท, 0 = ยังไม่กำหนด)",none:"ไม่มีข้อมูล",note:"หมายเหตุ",jsonHelp:"แก้ไขคอร์สในรูปแบบ JSON: modules[].lessons[] แต่ละบทมี id, type (video/article/quiz/file/task), th, en, notes_th, notes_en, quiz {th:[[คำถาม,[ตัวเลือก],ข้อถูก,คำอธิบาย]],en:[...]}, file, task",confirm:"ยืนยัน?",bad:"ข้อมูลไม่ถูกต้อง"},
en:{login:"Admin login",email:"Admin email",pw:"Password",setup:"First-time admin password setup",token:"Setup token (see server log)",newpw:"New password (min 10 characters)",logout:"Log out",
 dash:"Dashboard",orders:"Orders / Slips",members:"Members",courses:"Courses & Lessons",shorts:"Shorts",settings:"Prices",
 sMem:"Total members",sNew:"New this week",sPend:"Pending slips",sAppr:"Approved orders",sRevM:"Revenue this month (THB)",sRevT:"Revenue total (THB)",rev30:"Revenue, last 30 days",pendQ:"Latest pending slips",recent:"Recent signups",enroll:"Enrollment per course",
 approve:"Approve",reject:"Reject",view:"View slip",amount:"Amount (THB)",reason:"Reason (optional)",status:"Status",all:"All",pending:"Pending",approved:"Approved",rejected:"Rejected",search:"Search email or name",
 open:"Open",disable:"Disable",enable:"Enable",grant:"Grant",revoke:"Revoke",pk:"Packages",savePk:"Save packages",save:"Save",saved:"Saved",newCourse:"Add new course",del:"Delete",
 likes:"Likes",comments:"Comments",delc:"Delete comment",prices:"Package prices (THB, 0 = not set)",none:"No data",note:"Note",jsonHelp:"Edit course as JSON: modules[].lessons[] each with id, type (video/article/quiz/file/task), th, en, notes_th, notes_en, quiz {th:[[question,[options],correctIndex,explanation]],en:[...]}, file, task",confirm:"Are you sure?",bad:"Invalid data"}};
const PK={starter:"Starter",pro:"Pro",vip:"VIP Mentor",lifetime:"Lifetime"},PKS=Object.keys(PK);
const sv=p=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={dash:sv('<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>'),orders:sv('<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>'),members:sv('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>'),
 courses:sv('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'),shorts:sv('<rect x="6" y="2" width="12" height="20" rx="2"/><path d="m10 9 5 3-5 3z"/>'),settings:sv('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
 user:sv('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),plus:sv('<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/>'),clock:sv('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),check:sv('<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/>'),coin:sv('<circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2.5 0 0 0-2.5-1.5c-1.4 0-2.5.8-2.5 2s1.1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2A2.5 2.5 0 0 1 9.5 15M12 6v1.5M12 16.5V18"/>'),chart:sv('<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/>')};
let L=localStorage.getItem('pfx_lang')||'th',tab='dash';const t=k=>T[L][k]??k;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString(L=='th'?'th-TH':'en-US'),dt=s=>s?new Date(s).toLocaleString(L=='th'?'th-TH':'en-GB',{dateStyle:'medium',timeStyle:'short'}):'';
async function api(p,o={}){const r=await fetch('/api/lms/admin/'+p,{...o,headers:{'x-pfx':'1',...(o.json?{'content-type':'application/json'}:{})},body:o.json?JSON.stringify(o.json):undefined});let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,...j}}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('pfx_lang',L);go()});
const stag=s=>`<span class="tag ${s=='approved'?'ok':s=='rejected'?'bad':''}">${t(s)}</span>`;
async function go(){document.documentElement.lang=L;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));document.querySelectorAll('#navR .dyn').forEach(e=>e.remove());
 const s=await api('status');if(!s.logged)return s.setup?viewSetup(s):viewLogin(s);
 navR.insertAdjacentHTML('afterbegin',`<button class="btn o s dyn" id="lo">${t('logout')}</button>`);lo.onclick=async()=>{await api('logout',{method:'POST'});go()};
 app.innerHTML=`<div class="lay"><div class="menu">${['dash','orders','members','courses','content','cats','studio','shorts','settings'].map(k=>`<button class="${tab==k?'on':''}" data-k="${k}">${IC[k]} ${t(k)}</button>`).join('')}</div><div id="pane"></div></div>`;
 document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;go()});({dash,orders,members,courses,content,cats,studio,shorts,settings})[tab]()}
function viewLogin(s){app.innerHTML=`<div class="card" style="max-width:420px;margin:60px auto"><h2>${t('login')}</h2><form id="f"><label>${t('email')}</label><input name="email" type="email" value="${esc(s.email)}" required><label>${t('pw')}</label><input name="password" type="password" required autocomplete="current-password"><div id="m"></div><button class="btn" style="margin-top:14px">${t('login')}</button></form></div>`;
 f.onsubmit=async e=>{e.preventDefault();const r=await api('login',{method:'POST',json:Object.fromEntries(new FormData(f))});if(!r.ok)return m.innerHTML=`<div class="msg err">${esc(r.error)}</div>`;go()}}
function viewSetup(s){app.innerHTML=`<div class="card" style="max-width:460px;margin:60px auto"><h2>${t('setup')}</h2><p class="mut">${esc(s.email)}</p><form id="f"><label>${t('token')}</label><input name="token" required><label>${t('newpw')}</label><input name="password" type="password" minlength="10" required autocomplete="new-password"><div id="m"></div><button class="btn" style="margin-top:14px">${t('save')}</button></form></div>`;
 f.onsubmit=async e=>{e.preventDefault();const r=await api('setup',{method:'POST',json:Object.fromEntries(new FormData(f))});if(!r.ok)return m.innerHTML=`<div class="msg err">${esc(r.error)}</div>`;go()}}
function chart(days){const ks=Object.keys(days),vs=Object.values(days),mx=Math.max(1,...vs),W=600,H=200,bw=W/ks.length;
 return `<svg viewBox="0 0 ${W} ${H+20}" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd77a"/><stop offset="1" stop-color="#8a6a24"/></linearGradient></defs>
 ${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${H-f*H*.9}" y2="${H-f*H*.9}" stroke="#232937"/>`).join('')}${vs.map((v,i)=>`<rect x="${i*bw+2}" width="${bw-4}" y="${H-v/mx*H*.9}" height="${Math.max(1,v/mx*H*.9)}" rx="3" fill="url(#g)"><title>${ks[i]}: ${fmt(v)}</title></rect>`).join('')}
 <text x="0" y="${H+16}" fill="#9aa3b2" font-size="11">${ks[0].slice(5)}</text><text x="${W}" y="${H+16}" fill="#9aa3b2" font-size="11" text-anchor="end">${ks.at(-1).slice(5)}</text><text x="4" y="14" fill="#9aa3b2" font-size="11">${fmt(mx)}</text></svg>`}
function slipModal(o){mdc.innerHTML=`<div class="row" style="justify-content:space-between"><h3>${esc(o.name)} · ${PK[o.package]}</h3><button class="btn o s" onclick="md.classList.remove('open')">X</button></div><p class="mut">${esc(o.email)} · ${dt(o.created)}</p>${o.note?`<p>${t('note')}: ${esc(o.note)}</p>`:''}
 ${o.slip&&o.slip.mime=='application/pdf'?`<p><a class="btn o s" target="_blank" href="/api/lms/admin/slip/${o.id}">PDF</a></p><iframe src="/api/lms/admin/slip/${o.id}" style="width:100%;height:420px;border:0;border-radius:10px"></iframe>`:`<a target="_blank" href="/api/lms/admin/slip/${o.id}"><img class="slipimg" src="/api/lms/admin/slip/${o.id}" alt="slip"></a>`}
 ${o.status=='pending'?`<label>${t('amount')}</label><input id="am" type="number" min="0" value="${o.amount||''}"><label>${t('reason')}</label><input id="rs" maxlength="300"><div class="row" style="margin-top:12px"><button class="btn" id="ap">${t('approve')}</button><button class="btn red" id="rj">${t('reject')}</button></div>`:stag(o.status)}`;md.classList.add('open');
 if(window.ap){ap.onclick=()=>decide(o.id,'approve');rj.onclick=()=>decide(o.id,'reject')}}
async function decide(id,action){const r=await api('orders/'+id,{method:'POST',json:{action,amount:window.am&&am.value!==''?Number(am.value):undefined,reason:window.rs?rs.value:''}});md.classList.remove('open');go()}
let OR={};const orow=o=>(OR[o.id]=o,`<tr><td>${esc(o.name)}<br><small class="mut">${esc(o.email)}</small></td><td>${PK[o.package]}</td><td>${o.amount?fmt(o.amount):'-'}</td><td>${stag(o.status)}</td><td class="mut">${dt(o.created)}</td><td><div class="row"><button class="btn o s" onclick="slipModal(OR['${o.id}'])">${t('view')}</button>${o.status=='pending'?`<button class="btn s" onclick="quick('${o.id}')">${t('approve')}</button>`:''}</div></td></tr>`);
async function quick(id){if(!confirm(t('confirm')))return;await api('orders/'+id,{method:'POST',json:{action:'approve'}});go()}
async function dash(){const s=await api('stats');const card=(ic,v,k)=>`<div class="card st"><div class="ic">${IC[ic]}</div><b>${v}</b><span>${t(k)}</span></div>`;
 pane.innerHTML=`<h1 class="pg" style="margin-top:0">${t('dash')}</h1><div class="stats">${card('user',fmt(s.members),'sMem')}${card('plus',fmt(s.newWeek),'sNew')}${card('clock',fmt(s.pending),'sPend')}${card('check',fmt(s.approved),'sAppr')}${card('coin',fmt(s.revMonth),'sRevM')}${card('chart',fmt(s.revTotal),'sRevT')}</div>
 <div class="two"><div class="card chart"><h3>${t('rev30')}</h3>${chart(s.revDays)}</div><div class="card"><h3>${t('enroll')}</h3><table>${s.enroll.map(c=>`<tr><td>${esc(c[L])}</td><td style="text-align:right"><b>${c.count}</b></td></tr>`).join('')}</table></div></div>
 <div class="two"><div class="card tw"><h3>${t('pendQ')}</h3><table>${s.pendingList.map(orow).join('')||`<tr><td class="mut">${t('none')}</td></tr>`}</table></div><div class="card tw"><h3>${t('recent')}</h3><table>${s.recent.map(u=>`<tr><td>${esc(u.name)}<br><small class="mut">${esc(u.email)}</small></td><td class="mut">${dt(u.created)}</td></tr>`).join('')||`<tr><td class="mut">${t('none')}</td></tr>`}</table></div></div>
 <div class="card" style="margin-top:18px"><h3>${t('shorts')}</h3><table><tr><th>EP</th><th>${t('likes')}</th><th>${t('comments')}</th></tr>${s.shorts.map(x=>`<tr><td>${x.ep}</td><td>${x.likes}</td><td>${x.comments}</td></tr>`).join('')||`<tr><td class="mut">${t('none')}</td></tr>`}</table></div>`}
let OF='pending';async function orders(){const r=await api('orders'+(OF?'?status='+OF:''));pane.innerHTML=`<h1 class="pg" style="margin-top:0">${t('orders')}</h1><div class="row" style="margin-bottom:12px">${['pending','approved','rejected',''].map(s=>`<button class="btn ${OF==s?'':'o'} s" onclick="OF='${s}';orders()">${t(s||'all')}</button>`).join('')}</div>
 <div class="card tw"><table><tr><th>${t('members')}</th><th>${t('pk')}</th><th>${t('amount')}</th><th>${t('status')}</th><th></th><th></th></tr>${r.orders.map(orow).join('')||`<tr><td colspan="6" class="mut">${t('none')}</td></tr>`}</table></div>`}
let Q='';async function members(){const r=await api('users?q='+encodeURIComponent(Q));pane.innerHTML=`<h1 class="pg" style="margin-top:0">${t('members')}</h1><input id="q" placeholder="${t('search')}" value="${esc(Q)}" style="margin-bottom:12px">
 <div class="card tw"><table><tr><th>${t('members')}</th><th>${t('pk')}</th><th>${t('orders')}</th><th>${t('status')}</th><th></th></tr>${r.users.map(u=>`<tr><td>${esc(u.name)}<br><small class="mut">${esc(u.email)}</small></td><td>${u.packages.map(p=>PK[p]).join(', ')||'-'}</td><td>${u.orders}</td><td>${u.disabled?`<span class="tag bad">${t('disable')}</span>`:'<span class="tag ok">OK</span>'}</td><td><button class="btn o s" onclick="member('${u.id}')">${t('open')}</button></td></tr>`).join('')||`<tr><td colspan="5" class="mut">${t('none')}</td></tr>`}</table></div>`;
 q.oninput=()=>{clearTimeout(q.t);q.t=setTimeout(()=>{Q=q.value;members().then(()=>{q.focus();q.setSelectionRange(Q.length,Q.length)})},300)}}
async function member(id){const r=await api('users/'+id),u=r.user;mdc.innerHTML=`<div class="row" style="justify-content:space-between"><h3>${esc(u.name)}</h3><button class="btn o s" onclick="md.classList.remove('open')">X</button></div><p class="mut">${esc(u.email)} · ${dt(u.created)}</p>
 <label>${t('pk')}</label><div class="row">${PKS.map(p=>`<label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--txt)"><input type="checkbox" class="pkc" value="${p}" style="width:auto" ${u.packages.includes(p)?'checked':''}>${PK[p]}</label>`).join('')}<button class="btn s" id="spk">${t('savePk')}</button></div>
 <h3 style="margin-top:16px">${t('courses')}</h3><table>${r.courses.map(c=>`<tr><td>${esc(c[L])}</td><td>${c.access?`<span class="tag ok">${c.progress.pct}%</span>`:'-'}</td><td>${c.access?`<button class="btn red s" onclick="mu('${u.id}',{revoke:'${c.id}'})">${t('revoke')}</button>`:`<button class="btn o s" onclick="mu('${u.id}',{grant:'${c.id}'})">${t('grant')}</button>`}</td></tr>`).join('')}</table>
 <h3 style="margin-top:16px">${L=='en'?'Certificates':'ประกาศนียบัตร'}</h3><table>${(r.certs||[]).map(k=>`<tr><td>${esc(k.id)}<br><small class="mut">${esc(L=='en'?k.courseEn:k.courseTh)} · ${dt(k.issued)}</small></td><td>${k.status=='valid'?'<span class="tag ok">'+(L=='en'?'Valid':'ใช้ได้')+'</span>':'<span class="tag bad">'+(L=='en'?'Revoked':'เพิกถอนแล้ว')+'</span>'}</td><td><a class="btn o s" target="_blank" href="verify.html?c=${encodeURIComponent(k.id)}">${t('view')}</a> <button class="btn ${k.status=='valid'?'red':'o'} s" onclick="certSet('${u.id}','${esc(k.id)}','${k.status=='valid'?'revoked':'valid'}')">${k.status=='valid'?(L=='en'?'Revoke':'เพิกถอน'):(L=='en'?'Restore':'คืนสถานะ')}</button></td></tr>`).join('')||`<tr><td class="mut">${t('none')}</td></tr>`}</table>
 <h3 style="margin-top:16px">${t('orders')}</h3><table>${r.orders.map(o=>(OR[o.id]=o,`<tr><td>${PK[o.package]}</td><td>${stag(o.status)}</td><td class="mut">${dt(o.created)}</td><td><button class="btn o s" onclick="slipModal(OR['${o.id}'])">${t('view')}</button></td></tr>`)).join('')||`<tr><td class="mut">${t('none')}</td></tr>`}</table>
 <div style="margin-top:16px"><button class="btn ${u.disabled?'':'red'} s" onclick="mu('${u.id}',{disabled:${!u.disabled}})">${u.disabled?t('enable'):t('disable')}</button></div>`;md.classList.add('open');
 spk.onclick=()=>mu(u.id,{packages:[...document.querySelectorAll('.pkc:checked')].map(x=>x.value)})}
