<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PureFxAi - โปรไฟล์</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="lms.css">
<style>
.ph{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.av{width:96px;height:96px;border-radius:50%;background:#1d2230 center/cover;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font:600 2rem Kanit,sans-serif;color:var(--gold);flex:0 0 auto}
.tabs2{display:flex;gap:8px;margin:26px 0 14px;overflow-x:auto}.tabs2 button{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid #2c3343;background:none;color:var(--mut);font:inherit;cursor:pointer}.tabs2 button.on{border-color:var(--gold);color:#111;background:linear-gradient(135deg,var(--gold),var(--gold2))}
.pg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}.pc{color:inherit;text-decoration:none}.po{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#1d2230,#2a2410) center/cover;border:1px solid rgba(232,184,74,.2)}.po span{position:absolute;left:8px;top:8px;font-size:.66rem;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:8px}.po i{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}.pc b{display:block;font-size:.85rem;margin-top:6px}.pc small{color:var(--mut);font-size:.74rem}
</style></head><body>
<nav><div class="wrap"><a class="logo" href="index.html">PureFx<span>Ai</span></a><div class="nr"><a class="btn o s" href="index.html#series" data-t="ser"></a><a class="btn o s" href="learn.html" data-t="my"></a><div class="lang"><button data-l="th">TH</button><button data-l="en">EN</button></div></div></div></nav>
<main class="wrap" id="app" style="padding-bottom:60px"></main>
<script>
const T={th:{ser:"ซีรีส์",my:"คอร์สของฉัน",need:"เข้าสู่ระบบเพื่อดูโปรไฟล์ บันทึกตอนที่ชอบ และดูต่อจากที่ค้างไว้",login:"เข้าสู่ระบบ",signup:"สมัครสมาชิก",name:"ชื่อที่แสดง",avatar:"รูปโปรไฟล์ (JPG/PNG/WEBP ไม่เกิน 3 MB)",save:"บันทึก",saved:"บันทึกแล้ว",tSaved:"ตอนที่บันทึกไว้",tLiked:"ตอนที่ถูกใจ",tHist:"ประวัติการดู",empty:"ยังไม่มีรายการ",clear:"ล้างประวัติ",courses:"ไปที่คอร์สของฉัน",logout:"ออกจากระบบ",err:"เกิดข้อผิดพลาด"},
en:{ser:"Series",my:"My courses",need:"Log in to see your profile, save episodes and continue where you left off.",login:"Log in",signup:"Sign up",name:"Display name",avatar:"Profile photo (JPG/PNG/WEBP, max 3 MB)",save:"Save",saved:"Saved",tSaved:"Saved episodes",tLiked:"Liked episodes",tHist:"Watch history",empty:"Nothing here yet",clear:"Clear history",courses:"Go to my courses",logout:"Log out",err:"Something went wrong"}};
let L=localStorage.getItem('pfx_lang')||'th',tab='saved',ME,UD,ALL=[];const t=k=>T[L][k]||k,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const api=(p,o={})=>fetch('/api/lms/'+p,{...o,headers:{'x-pfx':'1',...(o.json?{'content-type':'application/json'}:{})},body:o.json?JSON.stringify(o.json):o.body});
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('pfx_lang',L);draw()});
async function load(){const r=await api('me');ME=r.ok?(await r.json()).user:null;if(ME)UD=await (await api('me/shorts')).json();
 const m=await (await fetch('/api/lms/series')).json();ALL=[];for(const s of m.series)for(const e of s.episodes)ALL.push({...e,series:s});draw()}
function card(id,h){const e=ALL.find(x=>x.id==id);if(!e)return'';const pct=h&&h.dur?Math.min(100,h.pos/h.dur*100):0;const cv=e.coverOk?e.cover:e.series.coverOk?e.series.cover:'';
 return `<a class="pc" href="index.html#v/${e.id}${h&&h.pos?'/'+Math.floor(h.pos):''}"><div class="po" style="background-image:url('${cv}'),linear-gradient(160deg,#1d2230,#2a2410)"><span>EP${e.n}</span>${pct?`<i style="width:${pct}%"></i>`:''}</div><b>${esc(e[L])}</b><small>${esc(e.series[L])}</small></a>`}
function draw(){document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));
 if(!ME){app.innerHTML=`<div class="card" style="max-width:460px;margin:60px auto;text-align:center"><p>${t('need')}</p><div style="display:flex;gap:10px;justify-content:center;margin-top:14px"><a class="btn" href="learn.html#login">${t('login')}</a><a class="btn o" href="learn.html#signup">${t('signup')}</a></div></div>`;return}
 const H=UD.history||{},list=tab=='saved'?UD.saved.map(id=>card(id)):tab=='liked'?UD.liked.map(id=>card(id)):Object.keys(H).sort((a,b)=>H[a].at>H[b].at?-1:1).map(id=>card(id,H[id]));
 app.innerHTML=`<div class="card" style="margin-top:26px"><div class="ph"><div class="av" id="av" style="${ME.avatar?`background-image:url('${ME.avatar}')`:''}">${ME.avatar?'':esc((ME.name||'?').slice(0,1))}</div><div style="flex:1;min-width:220px"><h1 class="pg" style="margin:0">${esc(ME.name)}</h1><p class="mut">${esc(ME.email)}</p></div><a class="btn o s" href="learn.html#dash">${t('courses')}</a><button class="btn o s" id="lo">${t('logout')}</button></div>
 <form id="pf" style="margin-top:18px;max-width:520px"><label>${t('name')}</label><input name="name" maxlength="80" value="${esc(ME.name)}" required><label>${t('avatar')}</label><input type="file" name="avatar" accept="image/jpeg,image/png,image/webp"><div id="pm"></div><button class="btn s" style="margin-top:12px">${t('save')}</button></form></div>
 <div class="tabs2">${['saved','liked','hist'].map(k=>`<button class="${tab==k?'on':''}" data-k="${k}">${t(k=='saved'?'tSaved':k=='liked'?'tLiked':'tHist')}</button>`).join('')}${tab=='hist'&&list.length?`<button id="ch">${t('clear')}</button>`:''}</div>
 <div class="pg2">${list.join('')||`<p class="mut">${t('empty')}</p>`}</div>`;
 document.querySelectorAll('.tabs2 [data-k]').forEach(b=>b.onclick=()=>{tab=b.dataset.k;draw()});
 if(window.ch)ch.onclick=async()=>{UD=await (await api('me/shorts',{method:'POST',json:{ep:'all',action:'clear-history'}})).json();draw()};
 lo.onclick=async()=>{await api('logout',{method:'POST'});location.href='index.html'};
 pf.onsubmit=async e=>{e.preventDefault();const r=await api('me/profile',{method:'POST',body:new FormData(pf)});const j=await r.json().catch(()=>({}));if(r.ok){ME=j.user;draw();pm.innerHTML=''}else pm.innerHTML=`<div class="msg err">${t('err')} (${esc(j.error||r.status)})</div>`}}
load();
</script></body></html>
